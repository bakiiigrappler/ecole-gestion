; Reglages PHP de l'image applicative.
;
; Les bulletins et les fiches partent en PDF depuis le navigateur, mais les
; imports de listes d'eleves et les photos passent, eux, par le serveur : les
; limites d'origine (2 Mo, 128 Mo) etaient trop basses pour un fichier de
; classe entiere.

upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 120
memory_limit = 512M

; Une trace lisible dans les journaux de Render, sans rien montrer au visiteur.
display_errors = Off
log_errors = On
error_log = /dev/stderr

date.timezone = Africa/Libreville
