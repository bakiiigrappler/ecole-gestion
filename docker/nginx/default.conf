# Nginx devant PHP-FPM, dans le meme conteneur.
#
# Render n'expose qu'un port par service : le decoupage en deux conteneurs du
# docker-compose local n'y a pas cours. Nginx ecoute donc sur ${PORT}, que
# Render fixe a l'execution.

server {
    listen ${PORT};
    server_name _;
    root /var/www/public;

    index index.php;
    charset utf-8;

    client_max_body_size 25M;

    # Les fichiers construits par Vite : ils ne changent qu'au deploiement.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    # Rien de ce qui commence par un point ne se sert, .env en premier.
    location ~ /\. {
        deny all;
    }
}
