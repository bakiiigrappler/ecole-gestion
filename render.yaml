# Plan de deploiement Render.
#
# Un seul service : l'application, servie par l'image Docker du depot, avec sa
# base SQLite dans un fichier.
#
# ┌──────────────────────────────────────────────────────────────────────────┐
# │ SQLite tient dans un fichier, et le disque d'un conteneur Render est      │
# │ EPHEMERE : a chaque redeploiement, a chaque redemarrage, a chaque reveil  │
# │ apres mise en veille, le fichier disparait et la base repart vide.        │
# │                                                                          │
# │ C'est acceptable pour montrer l'application. Ce ne l'est plus des qu'un   │
# │ etablissement y saisit de vraies inscriptions.                           │
# │                                                                          │
# │ Deux facons d'y remedier, le moment venu :                               │
# │   — attacher un disque persistant Render monte sur /var/www/database ;   │
# │   — revenir a PostgreSQL (bloc commente en fin de fichier).              │
# └──────────────────────────────────────────────────────────────────────────┘
#
# Ce qui n'est PAS ici : APP_KEY, qui est un secret. Render la demande a la
# creation. Elle s'obtient en local par `php artisan key:generate --show`.

services:
  - type: web
    name: egesco
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    region: frankfurt

    # `/login` plutot que `/` : la racine redirige vers la connexion, et une
    # sonde qui suit mal les redirections declarerait le service en panne.
    healthCheckPath: /login

    envVars:
      # --- Identite de l'application ---------------------------------------
      - key: APP_NAME
        value: Egesco
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"

      # Secret : demande a la creation, jamais ecrit dans le depot.
      - key: APP_KEY
        sync: false

      # Renseignee apres le premier deploiement, avec l'adresse attribuee.
      - key: APP_URL
        sync: false

      - key: APP_LOCALE
        value: fr
      - key: APP_FALLBACK_LOCALE
        value: fr
      - key: APP_TIMEZONE
        value: Africa/Libreville

      # --- Base de donnees : un fichier -------------------------------------
      # L'entrypoint cree le fichier s'il n'existe pas, applique les migrations,
      # et peuple la base au premier demarrage — sans quoi aucun compte
      # n'existerait pour s'y connecter.
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/database/database.sqlite

      # --- Sessions, cache, file d'attente ---------------------------------
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database

      # --- Journaux ---------------------------------------------------------
      # Sur la sortie d'erreur : c'est la que Render les lit.
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning

      # --- Demonstration ----------------------------------------------------
      # L'acces rapide est coupe d'office quand APP_ENV vaut « production ».
      # Ce deploiement-ci est une demonstration : on le rallume explicitement.
      # A retirer le jour ou un etablissement s'en sert reellement — publier des
      # mots de passe sur sa page de connexion serait alors une faille.
      - key: DEMO_ACCES_RAPIDE
        value: "true"

# ---------------------------------------------------------------------------
# Le jour ou la base doit survivre aux redeploiements : decommenter le bloc
# `databases` ci-dessous, remplacer les deux variables DB_CONNECTION et
# DB_DATABASE ci-dessus par
#
#       - key: DB_CONNECTION
#         value: pgsql
#       - key: DB_URL
#         fromDatabase:
#           name: egesco-db
#           property: connectionString
#
# puis redeployer. Les migrations sont ecrites pour les deux moteurs.
#
# databases:
#   - name: egesco-db
#     databaseName: egesco
#     user: egesco
#     plan: free
