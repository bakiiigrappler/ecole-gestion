<svg width="80" height="60" viewBox="0 0 80 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond du logo -->
  <rect width="80" height="60" fill="#1e40af" rx="8"/>
  
  <!-- Livre ouvert -->
  <rect x="20" y="15" width="40" height="30" fill="white" rx="2"/>
  <line x1="40" y1="15" x2="40" y2="45" stroke="#1e40af" stroke-width="2"/>
  
  <!-- Lignes de texte -->
  <line x1="25" y1="22" x2="35" y2="22" stroke="#1e40af" stroke-width="1.5"/>
  <line x1="25" y1="28" x2="35" y2="28" stroke="#1e40af" stroke-width="1.5"/>
  <line x1="25" y1="34" x2="35" y2="34" stroke="#1e40af" stroke-width="1.5"/>
  
  <line x1="45" y1="22" x2="55" y2="22" stroke="#1e40af" stroke-width="1.5"/>
  <line x1="45" y1="28" x2="55" y2="28" stroke="#1e40af" stroke-width="1.5"/>
  <line x1="45" y1="34" x2="55" y2="34" stroke="#1e40af" stroke-width="1.5"/>
  
  <!-- Étoile au-dessus -->
  <polygon points="40,8 42,14 48,14 43,18 45,24 40,20 35,24 37,18 32,14 38,14" fill="white"/>
  
  <!-- Texte "ÉCOLE" -->
  <text x="40" y="52" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="8" font-weight="bold">ÉCOLE</text>
</svg>
