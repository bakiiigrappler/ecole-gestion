version: '3.8'

services:
  # Application Laravel
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: egestco-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - egestco-network
    depends_on:
      - database
      - redis

  # Serveur Web Nginx
  webserver:
    image: nginx:alpine
    container_name: egestco-webserver
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d/:/etc/nginx/conf.d/
    networks:
      - egestco-network
    depends_on:
      - app

  # Base de données PostgreSQL
  database:
    image: postgres:16-alpine
    container_name: egestco-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-egesco}
      POSTGRES_USER: ${DB_USERNAME:-egesco}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-egesco}
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-egesco} -d ${DB_DATABASE:-egesco}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - egestco-network

  # Cache Redis
  redis:
    image: redis:alpine
    container_name: egestco-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - egestco-network

  # Queue Worker
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: egestco-queue
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    command: php artisan queue:work --verbose --tries=3 --timeout=90
    networks:
      - egestco-network
    depends_on:
      - database
      - redis

volumes:
  dbdata:
    driver: local

networks:
  egestco-network:
    driver: bridge
